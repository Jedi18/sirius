sirius:
  topology:
    num_gpus: 1
  memory:
    gpu:
      usage_limit_fraction: 0.4
      reservation_limit_fraction: 1.0
    host:
      capacity_bytes: 32000000000
      initial_number_pools: 10
      pool_size: 512
      block_size: 1048576
  executor:
    pipeline:
      num_threads: 4
    task_creator:
      num_threads: 2
    downgrade:
      num_threads: 1
      monitor_period: 10ms
  operator_params:
    scan_task_batch_size: 8Mi
    max_sort_partition_bytes: 8Mi
    cross_join_task_bytes: 8Mi
    sort_sample_bytes: 8Mi
    hash_partition_bytes: 8Mi
    concat_batch_bytes: 8Mi
    max_build_hash_table_bytes: 90000000
