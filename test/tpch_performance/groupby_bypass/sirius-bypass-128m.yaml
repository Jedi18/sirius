# Ample-memory arm.
#
# hash_partition_bytes is lowered from the engine default so the automatic policy picks more than
# one partition on this dataset — that is the precondition the prototype exists to overturn, and it
# is recorded here rather than left implicit.
#
# scan_task_batch_size is lowered for the same reason, by the mechanism the rerun documented: more
# scan batches means the same grouping keys appear in more local aggregate outputs, so the partial
# input the merge must combine grows without the final result growing. That keeps the result set
# small enough to render and compare exactly, without adding an ORDER BY/LIMIT that would change
# the downstream pipeline.
#
# Both values are identical in both arms; only enable_group_by_memory_aware_bypass differs.
sirius:
  topology:
    num_gpus: 1
  operator_params:
    hash_partition_bytes: 128Mi
    scan_task_batch_size: 64Mi
    group_by_bypass_headroom_fraction: 0.25
